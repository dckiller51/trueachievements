[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trueachievements"
version = "2026.10.1"
description = "Home Assistant custom integration for TrueAchievements: gamerscore, TA score, completion and current game stats."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["homeassistant>=2026.9.0"]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pylint==4.1.3",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component>=0.13.372",
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://github.com/dckiller51/trueachievements"
Issues = "https://github.com/dckiller51/trueachievements/issues"

[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["tests*"]

# ---------------------------------------------------------------------------
# Ruff: replaces black, isort, flake8 (+ flake8-docstrings) and pyupgrade
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
    "D",   # pydocstyle (flake8-docstrings)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PGH", # pygrep-hooks
    "RUF", # ruff-specific rules
    "BLE", # flake8-blind-except
]
ignore = [
    "E501",   # line too long (handled by the formatter, long URLs)
    "D202",   # no blank lines allowed after function docstring
    "D107",   # missing docstring in __init__
    "RUF002", # ambiguous unicode character in docstring
    "UP024",  # replace aliased errors with OSError
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["D", "T201", "BLE001", "S310"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# pylint
# ---------------------------------------------------------------------------
[tool.pylint.main]
ignore = ["tests"]
jobs = 2
fail-on = ["useless-suppression"]
fail-under = 10.0
persistent = false

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "_", "T", "x", "y", "id"]

[tool.pylint."messages control"]
# These flags are disabled to align with Home Assistant development standards
# and to avoid false positives caused by Python dataclasses or long URLs.
disable = [
    "format",                         # Handled by Ruff
    "abstract-method",                # Async methods often trigger this incorrectly
    "cyclic-import",                  # Does not account for conditional imports
    "duplicate-code",                 # Often unavoidable in platform definitions
    "inconsistent-return-statements", # Does not handle 'raise' correctly
    "too-many-instance-attributes",   # R0902: integration entities often exceed 7 attributes
    "wrong-import-order",             # Handled by Ruff
    "too-few-public-methods",         # Standard for many simple HA entities
    "unexpected-keyword-arg",         # E1123: false positives on SensorEntityDescription
    "no-value-for-parameter",         # False positives with HA dataclasses
    "too-many-locals",                # Allows complex CSV parsing in the coordinator (R0914)
    "wildcard-import",                # Suppresses W0401 alerts
    "unused-wildcard-import",         # Suppresses W0614 alerts
    "line-too-long",                  # Ignore long TrueAchievements URLs (C0301)
    "missing-final-newline",          # Prevents C0304 if a file lacks a trailing newline
]
enable = ["useless-suppression", "use-symbolic-message-instead"]

[tool.pylint.reports]
score = true

[tool.pylint.refactoring]
max-nested-blocks = 5
never-returning-functions = ["sys.exit", "argparse.parse_error"]

[tool.pylint.format]
expected-line-ending-format = "LF"

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtins.BaseException", "builtins.Exception"]

# ---------------------------------------------------------------------------
# bandit (https://bandit.readthedocs.io/en/latest/config.html)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-rxf -v -l --cov=custom_components --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:"]

[tool.bandit]
tests = [
    "B103",
    "B108",
    "B306",
    "B307",
    "B313",
    "B314",
    "B315",
    "B316",
    "B317",
    "B318",
    "B319",
    "B320",
    "B601",
    "B602",
    "B604",
    "B608",
    "B609",
]
