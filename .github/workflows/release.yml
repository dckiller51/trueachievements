name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the archive to"
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Attach trueachievements.zip to the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the HACS archive
        # HACS expects the integration files at the root of the zip.
        run: |
          cd custom_components/trueachievements
          zip -r "${GITHUB_WORKSPACE}/trueachievements.zip" . -x "__pycache__/*" "*.pyc"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" trueachievements.zip --clobber
